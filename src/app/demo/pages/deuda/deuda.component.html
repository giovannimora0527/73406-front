<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
  [fullScreen]="true"
>
  {{ msjSpinner }}...
</ngx-spinner>

<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="row">
        <div class="col">
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="crearModal('C')"
            title="Crear una nueva deuda"
          >
            <i class="fa fa-plus"></i>
            &nbsp;Nueva deuda
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col">
          <div class="card">
            <div class="card-body">
              <div class="table table-responsive">
                <table class="table table-responsive table-stripped">
                  <thead>
                    <tr>
                      <th>Usuario</th>
                      <th>Libro</th>
                      <th>Préstamo</th>
                      <th>Monto</th>
                      <th>Estado</th>
                      <th class="text-center">Opciones</th>
                    </tr>
                  </thead>
                  <tbody *ngIf="deudas.length === 0">
                    <tr>
                      <td colspan="6" class="text-center">
                        No hay registros disponibles
                      </td>
                    </tr>
                  </tbody>
                  <tbody *ngIf="deudas.length > 0">
                    <tr *ngFor="let deuda of deudas">
                      <td>{{ deuda.usuario?.nombre }}</td>
                      <td>{{ deuda.libro?.titulo }}</td>
                      <td>{{ deuda.prestamo?.idPrestamo }}</td>
                      <td>{{ deuda.monto | currency }}</td>
                      <td>{{ deuda.estado }}</td>
                      <td class="text-center">
                        <button
                          class="btn btn-outline-primary btn-sm"
                          title="Editar deuda"
                          (click)="abrirModoEdicion(deuda)"
                        >
                          <i class="fa fa-edit"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para crear o editar deuda -->
  <div
    class="modal fade"
    id="crearModal"
    tabindex="-1"
    aria-labelledby="crearModalLabel"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crearModalLabel">{{ titleModal }}</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="form">
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <select formControlName="id_usuario" class="form-select">
                <option [value]="null" disabled>Seleccione un usuario</option>
                <option *ngFor="let usuario of usuarios" [value]="usuario.idUsuario">
                  {{ usuario.nombre }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="libro" class="form-label">Libro</label>
              <select formControlName="id_libro" class="form-select">
                <option [value]="null" disabled>Seleccione un libro</option>
                <option *ngFor="let libro of libros" [value]="libro.idLibro">
                  {{ libro.titulo }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="prestamo" class="form-label">Préstamo</label>
              <select formControlName="id_prestamo" class="form-select">
                <option [value]="null" disabled>Seleccione un préstamo</option>
                <option *ngFor="let prestamo of prestamos" [value]="prestamo.idPrestamo">
                  Préstamo #{{ prestamo.idPrestamo }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="monto" class="form-label">Monto</label>
              <input
                type="number"
                formControlName="monto"
                class="form-control"
                placeholder="Ingrese el monto de la deuda"
              />
              <div
                *ngIf="form.get('monto')?.hasError('required') && form.get('monto')?.touched"
                class="text-danger"
              >
                El monto es requerido.
              </div>
            </div>

            <div class="mb-3">
              <label for="estado" class="form-label">Estado</label>
              <select formControlName="estado" class="form-select">
                <option value="" disabled>Seleccione el estado</option>
                <option value="pendiente">Pendiente</option>
                <option value="pagada">Pagada</option>
              </select>
              <div
                *ngIf="form.get('estado')?.hasError('required') && form.get('estado')?.touched"
                class="text-danger"
              >
                El estado es requerido.
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="cerrarModal()"
          >
            Cerrar
          </button>
          <button
            type="button"
            class="btn btn-primary"
            (click)="guardarActualizar()"
          >
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
