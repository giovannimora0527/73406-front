<!-- src/app/demo/pages/autor/autor.component.html -->
<div class="container mt-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Gestión de Autores</h5>
      <button class="btn btn-outline-primary btn-sm" (click)="crearAutorModal()">+ Nuevo</button>
    </div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Nacionalidad</th><th>F. Nac.</th><th>Opciones</th></tr>
        </thead>
        <tbody *ngIf="autores.length; else noData">
          <tr *ngFor="let autor of autores">
            <td>{{ autor.idAutor }}</td>
            <td>{{ autor.nombre }}</td>
            <td>{{ autor.nacionalidad }}</td>
            <td>{{ autor.fechaNacimiento | date:'yyyy-MM-dd' }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" (click)="editarAutorModal(autor)">
                <i class="fa fa-edit"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #noData>
        <div class="text-center text-muted">No hay registros disponibles</div>
      </ng-template>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="autorModal" tabindex="-1" aria-labelledby="autorModalLabel" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="autorModalLabel">{{ titleModal }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <form [formGroup]="form" (ngSubmit)="guardarActualizarAutor()">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input formControlName="nombre" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Nacionalidad</label>
            <input formControlName="nacionalidad" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Fecha Nacimiento</label>
            <input formControlName="fechaNacimiento" type="date" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cerrar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
